plugins {
    id "com.android.application"
}

android {
    namespace "com.wltest"
    compileSdk 36
    ndkVersion "30.0.14904198"

    defaultConfig {
        applicationId "com.wltest"
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty("VERSION_CODE").get().toInteger()
        versionName providers.gradleProperty("VERSION_NAME").get()

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "4.1.2"
        }
    }
}
