name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;34.0.0" "ndk;30.0.14904198" "cmake;4.1.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Read app version
        shell: bash
        run: |
          echo "VERSION_CODE=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${GITHUB_REF_NAME:-v$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)}" >> "$GITHUB_ENV"

      - name: Validate release tag
        shell: bash
        run: |
          expected="v${VERSION_NAME}"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match VERSION_NAME ${VERSION_NAME}."
            echo "Expected tag: ${expected}"
            exit 1
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/WLTest-${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WLTest ${{ env.RELEASE_TAG }}
          body: |
            Version name: ${{ env.VERSION_NAME }}
            Version code: ${{ env.VERSION_CODE }}
            Commit: ${{ github.sha }}
          files: release/*.apk
          make_latest: true
          overwrite_files: true
